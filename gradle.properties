# Plugin version prefix. CI publishes <pluginMajorMinor>.<run number>, e.g. 0.1.42.
pluginMajorMinor=0.1

# Target IDE. If `localIdePath` points to an installed IDE, it is used instead of downloading WebStorm
# (on CI the path does not exist, so WebStorm `platformVersion` is downloaded).
platformVersion=2026.1.5
localIdePath=C:/Program Files/JetBrains/WebStorm 2025.2.4

# The IDE ships its own Kotlin stdlib.
kotlin.stdlib.default.dependency=false

org.gradle.caching=true
